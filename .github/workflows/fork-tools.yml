name: Fork tools

on:
  push:
    branches: [main]
    paths:
      - tools/**
      - tests/fork/**
      - .github/dependabot.yml
      - .github/dependency-deferrals.json
      - .github/workflows/**
  pull_request:
    paths:
      - tools/**
      - tests/fork/**
      - .github/**

permissions:
  contents: read

jobs:
  test:
    name: fork tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=9" "pyyaml>=6"
      - run: python -m pytest tests/fork -q
