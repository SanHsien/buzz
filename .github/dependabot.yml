version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Taipei"}
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]

  # Cargo workspace: one lock (Cargo.lock) covers every crate in `crates/`.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Taipei"}
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]

  # The Tauri crate is excluded from the workspace and has its own lock.
  - package-ecosystem: "cargo"
    directory: "/desktop/src-tauri"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Taipei"}
    open-pull-requests-limit: 3
    labels: ["dependencies", "rust"]
    groups:
      tauri-minor-patch:
        update-types: ["minor", "patch"]

  # pnpm workspace (pnpm-lock.yaml at the root covers desktop, web and admin-web).
  - package-ecosystem: "npm"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Taipei"}
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pub"
    directory: "/mobile"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Taipei"}
    open-pull-requests-limit: 3
    labels: ["dependencies", "mobile"]
    groups:
      pub-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Asia/Taipei"}
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
